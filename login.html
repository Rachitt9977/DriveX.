<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drive-X | Account</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body>
<div class="loader" id="preloader"><div class="loader-box"><div class="logo"><span class="logo-icon">🚘</span><span class="logo-text">Drive<span>-X</span></span></div><div class="ring"></div></div></div>
<div class="auth">
<div class="auth-image"><a href="index.html">← Back to Home</a><div><h1>Drive Your <span class="gold">Dream</span></h1><p>Premium vehicles. Transparent prices. Zero hassle.</p></div></div>
<section class="auth-form">
<a class="logo" href="index.html"><span class="logo-icon">🚘</span><span class="logo-text">Drive<span>-X</span></span></a>
<label class="switch">☀︎<input id="themeToggle" type="checkbox">☾</label>
<input type="radio" name="tab" id="login" checked style="display:none"><input type="radio" name="tab" id="signup" style="display:none">
<div class="tabs"><label for="login">Log In</label><label for="signup">Sign Up</label></div>
<form class="login-form" onsubmit="return false;"><h2 style="font:600 30px 'Poppins';margin:0 0 6px">Welcome Back</h2><p class="meta">Log in to manage your bookings.</p>
<label>Email<input class="field-input" type="email" placeholder="you@example.com" required></label>
<label>Password<input class="field-input" type="password" placeholder="••••••••" required></label>
<button class="btn primary" style="width:100%">Log In</button></form>
<form class="signup-form" onsubmit="return false;"><h2 style="font:600 30px 'Poppins';margin:0 0 6px">Create Account</h2><p class="meta">Start renting or buying your dream car.</p>
<label>Full Name<input class="field-input" type="text" placeholder="John Doe" required></label>
<label>Email<input class="field-input" type="email" placeholder="you@example.com" required></label>
<label>Password<input class="field-input" type="password" placeholder="Create a password" required></label>
<button class="btn primary" style="width:100%">Create Account</button></form>
</section></div>
<script src="theme.js"></script><script src="loader.js"></script>
</body></html>
